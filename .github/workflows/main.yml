name: FlashDeal Star - Supreme Final Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # إضافة: لتسريع عمليات البناء القادمة

    - name: 3. Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libboost-all-dev libatlas-base-dev
    
    - name: 4. Secure AI & SIM Installation
      run: |
        python -m pip install --upgrade pip setuptools wheel # إضافة: لضمان توافق المكتبات القديمة
        pip install --no-cache-dir numpy==1.23.5 opencv-python-headless
        export DLIB_USE_CUDA=0
        export MAKEFLAGS="-j2"
        pip install --no-cache-dir dlib==19.24.1 face-recognition pyserial
        echo "AI Core & SIM Protocols: DEPLOYED ✅"

    - name: 5. Final Verification
      run: |
        python -c "import face_recognition; import serial; print('FlashDeal Star Integrity: 100% OK ✅')"
        echo "Talk. Pay. Done. System is Active."
